name: Notes API CI

permissions:
  contents: read
  packages: write


on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  APP_NAME: notes-api

jobs:
  test:
    env:
      APP_ENV: testing
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Print application configuration
        run: |
          echo "Application Name: $APP_NAME"
          echo "Application Environment: $APP_ENV"

      - name: Display runner information
        run: |
          echo "Runner OS: ${{runner.os}}"
          echo "Runner Architecture: ${{runner.arch}}"
          echo "Runner Workspace: ${{runner.workspace}}"

      - name: Display Strategy Matrix Information
        run: |
          echo "Python Version: ${{ matrix.python-version }}"
          echo "Job Index ${{ strategy.job-index }}"
          echo "Total Jobs: ${{ strategy.job-total }}"

      - name: Print app name from repository variable
        env:
          APP_NAME: ${{ vars.APP_NAME }}
        run: echo "APP_NAME=$APP_NAME"


  lint:
    env:
      PYTHON_VERSION: "3.12"

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m ruff check app tests

  quality-summary:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Print CI success
        run: echo "All tests and linting passed successfully!"


  docker:
    needs: quality-summary
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/adityaprakashjoshi/k8s-notes-api
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ghcr.io/adityaprakashjoshi/k8s-notes-api:security-test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/adityaprakashjoshi/k8s-notes-api:security-test
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image to GHCR
        env:
          IMAGE_NAME: ghcr.io/adityaprakashjoshi/k8s-notes-api
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag "$IMAGE_NAME:security-test" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
